name: ci
on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: select CI gates from trusted PR base
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.selector.outputs.rust }}
      coding_harness: ${{ steps.selector.outputs.coding_harness }}
      supervisor: ${{ steps.selector.outputs.supervisor }}
      acl_replay: ${{ steps.selector.outputs.acl_replay }}
      pg_observation: ${{ steps.selector.outputs.pg_observation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.0.0'
      - name: select affected gates without exposing changed paths
        id: selector
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          full() {
            printf '%s\n' 'rust=true' 'coding_harness=true' 'supervisor=true' \
              'acl_replay=true' 'pg_observation=true' >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" != pull_request ]; then
            full
            exit 0
          fi
          selector="$RUNNER_TEMP/select-ci-gates.mjs"
          manifest="$RUNNER_TEMP/base-harness-manifest.json"
          qualification_inventory="$RUNNER_TEMP/base-pg-observation-inputs.tsv"
          if ! git show "${BASE_SHA}:coding-harness/scripts/select-ci-gates.mjs" > "$selector"; then
            full
            exit 0
          fi
          if ! git show "${BASE_SHA}:coding-harness/.harness/manifest.json" > "$manifest"; then
            full
            exit 0
          fi
          if ! git show "${BASE_SHA}:tests/postgresql/observation-qualification-inputs-v1.tsv" \
            > "$qualification_inventory"; then
            full
            exit 0
          fi
          selected="$RUNNER_TEMP/selected-ci-gates"
          if ! node "$selector" --event "$EVENT_NAME" --repository "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --manifest "$manifest" \
            --qualification-inventory "$qualification_inventory" > "$selected"; then
            full
            exit 0
          fi
          # A trusted base predating this fifth output cannot classify it. Run it
          # until the new selector is itself present on the protected base.
          if ! grep -Eq '^pg_observation=(true|false)$' "$selected"; then
            full
            exit 0
          fi
          cat "$selected" >> "$GITHUB_OUTPUT"

  coding-harness:
    name: coding harness · node ${{ matrix.node }} · build · test
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.coding_harness != 'false') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
            native_required: '0'
          - node: '24.14.1'
            native_required: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The acceptance-task contract verifies the immutable #8 source-fix
          # commit, so its history is a test input rather than an optimisation.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: coding-harness/package-lock.json
      - name: install pinned harness dependencies
        run: npm --prefix coding-harness ci --ignore-scripts
      - name: build canonical coding harness
        run: npm --prefix coding-harness run build
      - name: verify committed controller attestation is current
        run: git diff --exit-code -- coding-harness/.harness/controller-build.json
      - name: test canonical coding harness
        env:
          HARNESS_REQUIRE_NATIVE_INTEGRATION: ${{ matrix.native_required }}
        run: npm --prefix coding-harness test

  supervisor-service:
    name: supervisor evidence oracle · node ${{ matrix.node }} · sealed build · test
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.supervisor != 'false') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
          - node: '24.14.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: coding-harness/supervisor-service/package-lock.json
      - name: install pinned supervisor-service dependencies
        run: npm --prefix coding-harness/supervisor-service ci --ignore-scripts
      - name: verify sealed supervisor-service artifact
        run: npm --prefix coding-harness/supervisor-service run verify
      - name: verify committed supervisor-service attestation is current
        run: git diff --exit-code -- coding-harness/supervisor-service/.service/artifact.json

  postgresql-public-acl-replay:
    name: PostgreSQL ACL additive V3 suite · node ${{ matrix.node }} · eight isolated runs
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.acl_replay != 'false') }}
    runs-on: ubuntu-24.04
    # Covers the conservative 140-minute sum of all eight isolated replay/cleanup ceilings.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
          - node: '24.14.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: pull exact PostgreSQL 16.15 platform manifest
        run: docker pull postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
      # V1/V2 are immutable historical receipts whose pg_isready-only runners
      # raced the image's temporary init server. V3 pins them but never reruns them.
      - name: replay four additive V3 profiles from owned isolated containers
        run: |
          node coding-harness/supervisor-service/scripts/replay-postgresql-public-acl-suite-v3.mjs baseline-v1
          node coding-harness/supervisor-service/scripts/replay-postgresql-public-acl-suite-v3.mjs baseline-v2
          node coding-harness/supervisor-service/scripts/replay-postgresql-public-acl-suite-v3.mjs branch
          node coding-harness/supervisor-service/scripts/replay-postgresql-public-acl-suite-v3.mjs final-where

  postgresql-observation-qualification:
    name: PostgreSQL observation · ${{ matrix.postgres_patch }} · node ${{ matrix.node }}
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.pg_observation != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
            postgres_patch: '16.9'
            postgres_image: postgres@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
          - node: '24.14.1'
            postgres_patch: '16.9'
            postgres_image: postgres@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
          - node: '20.0.0'
            postgres_patch: '16.15'
            postgres_image: postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
          - node: '24.14.1'
            postgres_patch: '16.15'
            postgres_image: postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The receipt verifier reads exact historical source commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node builds and executes evidence tooling; it is not product runtime.
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: coding-harness/package-lock.json
      - name: install pinned evidence-harness dependencies
        run: npm --prefix coding-harness ci --ignore-scripts
      - name: build canonical evidence harness
        run: npm --prefix coding-harness run build
      - name: pull exact Rust builder platform manifest
        env:
          RUST_BUILDER_IMAGE: rust@sha256:c993d32d95cc146bd12c84d66f0b924a6a96f3988325f39c144f2f9893dea120
        run: docker pull --platform linux/amd64 "$RUST_BUILDER_IMAGE"
      - name: pull exact PostgreSQL platform manifest
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres_image }}
        run: docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
      - name: replay exact PostgreSQL observation receipt
        run: npm --prefix coding-harness run postgres-observation-qualification -- replay --patch "${{ matrix.postgres_patch }}"

  build:
    name: fmt · clippy · build · test
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    runs-on: ubuntu-24.04
    # Live PostgreSQL/MySQL/SQL Server service containers. The sealed PostgreSQL
    # and MySQL RDB2RDF receipt checks below explicitly require their live services;
    # other provider-specific suites still expose their live-optional grade in the
    # generated capability matrix rather than becoming production-admission evidence.
    # `sqlserver-backend` is
    # already enabled here via workspace feature unification (sf-conformance
    # depends on sf-sql with it on) — no extra feature flag is needed below.
    services:
      postgres:
        image: postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16
        env:
          POSTGRES_USER: sftest
          POSTGRES_PASSWORD: sftest
          POSTGRES_DB: sftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0 # mysql:8
        env:
          MYSQL_ROOT_PASSWORD: sftest
          MYSQL_DATABASE: sftest
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89 # 2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SfTest123!
        ports:
          - 11433:1433
    env:
      SF_PG_URL: "host=127.0.0.1 port=5432 user=sftest password=sftest dbname=sftest"
      SF_MYSQL_URL: "mysql://root:sftest@127.0.0.1:13306/sftest"
      SF_MSSQL_URL: "server=tcp:localhost,11433;user id=SA;password=SfTest123!"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # SQL Server has no lightweight in-container healthcheck tool available to
      # `options:`, unlike postgres/mysql above — poll the TCP port directly instead.
      - name: wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/11433) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::warning::SQL Server did not become reachable in time — differential_mssql will skip gracefully"
      # Dependency vulnerability gate (F2 item 3, ADR-0010 closeout receipt):
      # `cargo audit` reads .cargo/audit.toml's documented ignore-list (advisories
      # confirmed unfixable without an upstream crate's own version bump) and fails
      # the build on anything not on it — a real gate, not `|| true`.
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        run: cargo --locked audit
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --locked --workspace --all-targets
      - name: test
        run: cargo test --locked --workspace
      - name: verify standalone serving profile and required-live source TLS
        timeout-minutes: 6
        run: |
          set -euo pipefail
          bash scripts/check-serving-profile.sh
          cargo clippy --locked -p sf-cli --no-default-features --all-targets -- -D warnings
          cargo test --locked -p sf-cli --no-default-features
          test_name='authenticated_public_queries_require_verified_source_tls'
          cargo test --locked -p sf-cli --no-default-features --test source_tls_live -- --ignored --exact "$test_name" --list | grep -Fx "$test_name: test"
          cargo test --locked -p sf-cli --no-default-features --test source_tls_live -- --ignored --exact "$test_name" --nocapture
      # Private ADR-0040 comparison evidence only. The feature stays default-off
      # and this gate does not admit the substrate into product execution.
      - name: clippy (sf-sparql secure-spill-prototype)
        run: cargo clippy --locked -p sf-sparql --features secure-spill-prototype --all-targets -- -D warnings
      - name: test (sf-sparql secure-spill-prototype)
        run: cargo test --locked -p sf-sparql --features secure-spill-prototype --lib federation::global::spill
      - name: test required-live PostgreSQL verified-generation lifecycle
        timeout-minutes: 5
        env:
          # This administrator endpoint exists only inside the ephemeral CI
          # service and provisions a unique database plus restricted reader.
          SF_PG_GENERATION_TEST_URL: "host=127.0.0.1 port=5432 user=sftest password=sftest dbname=sftest"
        run: |
          set -euo pipefail
          test_name='pg_generation::live_tests::verified_generation_lifecycle_is_coherent_and_fail_closed'
          listed="$(cargo test --locked -p sf-serve --lib "$test_name" -- --ignored --exact --list)"
          test "$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test")" = 1
          cargo test --locked -p sf-serve --lib "$test_name" -- \
            --ignored --exact --test-threads=1 --nocapture
      - name: test required-live PostgreSQL public row security
        timeout-minutes: 5
        env:
          SF_PG_RLS_TEST_URL: "host=127.0.0.1 port=5432 user=sftest password=sftest dbname=sftest"
        run: |
          set -euo pipefail
          test_name='pg_generation::live_tests::rls::public_row_security_is_isolated_and_cleans_pool'
          listed="$(cargo test --locked -p sf-serve --lib "$test_name" -- --ignored --exact --list)"
          test "$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test")" = 1
          cargo test --locked -p sf-serve --lib "$test_name" -- \
            --ignored --exact --test-threads=1 --nocapture
      # DuckDB backend (embedded, `bundled` feature — no external service needed).
      # `cargo test --locked --workspace` above doesn't enable `duckdb-backend` and no other
      # crate in the dependency graph turns it on, so these tests never ran in CI
      # until this dedicated step was added.
      - name: test (sf-sql duckdb-backend)
        run: cargo test --locked -p sf-sql --features duckdb-backend
      # SAP HANA marshalling/quoting unit tests only (backend::hana::tests::with_driver) —
      # pure value-marshalling logic with no connection, safe to run here. The rest of
      # the hana-backend surface needs a live SAP HANA server, so it's excluded.
      - name: test (sf-sql hana-backend marshalling)
        run: cargo test --locked -p sf-sql --features hana-backend backend::hana::tests::with_driver
      # ODBC quote-escaping unit tests only (backend::odbc::real::tests) — pure string
      # logic, no live driver/DSN needed. `odbc-api` links against the SYSTEM unixODBC
      # library at COMPILE time even for this (confirmed: the feature fails to link
      # without libodbc present, despite the test itself doing no ODBC I/O), so the
      # driver manager package is installed first; the rest of the odbc-backend surface
      # (DB2/H2/Spark/Dremio/Denodo/Teiid) needs a live DSN, so it's excluded.
      - name: install unixODBC (odbc-backend link dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev=2.3.12-1ubuntu0.24.04.1
      - name: test (sf-sql odbc-backend quote-escaping)
        run: cargo test --locked -p sf-sql --features odbc-backend backend::odbc::real::tests
      - name: verify canonical RDB2RDF inventory
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-inventory -- --check
      - name: replay sealed SQLite RDB2RDF outcome baseline
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-execution-receipt -- --check
      - name: replay sealed required-live PostgreSQL RDB2RDF outcome baseline
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-execution-receipt -- --backend postgresql --check
      - name: replay sealed required-live MySQL RDB2RDF outcome baseline
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-execution-receipt -- --backend mysql --check
      - name: test required-live MySQL cancellation cleanup ownership
        run: |
          set -euo pipefail
          test_name='mysql::tests::live_cancelled_run_removes_only_its_owned_scratch_database'
          listed="$(cargo test --locked -p sf-conformance --lib "$test_name" -- --ignored --exact --list)"
          test "$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test")" = 1
          cargo test --locked -p sf-conformance --lib "$test_name" -- \
            --ignored --exact --test-threads=1 --nocapture
      - name: clippy deterministic evidence receipt tooling
        run: cargo clippy --locked -p sf-conformance --features evidence-receipts --all-targets -- -D warnings
      # This mutable hosted runner validates parser-free receipt inputs and the
      # receipt tooling. It is not a controlled provenance builder, so CI neither
      # captures nor publishes a current-binary observation here.
      - name: test deterministic evidence receipt tooling
        run: cargo test --locked -p sf-conformance --features evidence-receipts --lib --bin rust-closure-receipt --test binary_artifact_receipt --test regression_baseline_cli --test rust_closure_receipt -- --test-threads=1
      - name: replay expected SQLite SPARQL query regression baseline
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin sparql-query-regression-baseline -- --check
      - name: replay expected SQLite SPARQL protocol regression baseline
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin sparql-protocol-regression-baseline -- --check
      # This is a project-supported subset replay, not a W3C Query/Protocol
      # conformance or backend-admission claim. The fixed test inventory keeps a
      # removed replay or mutation gate from degrading into a zero-test pass.
      - name: replay sealed SQLite supported SPARQL Query and Protocol surface
        run: |
          set -euo pipefail
          listed="$(cargo test --locked -p sf-conformance --features evidence-receipts \
            --test supported_surface_sqlite -- --list)"
          for test_name in \
            compiled_seals_reject_exact_inventory_mutants \
            sealed_inventories_have_explicit_typed_outcome_totals \
            sealed_protocol_supported_surface_matches_public_sqlite_behavior \
            sealed_query_supported_surface_matches_public_sqlite_behavior \
            standard_snapshots_match_capability_catalog_authority
          do
            test "$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test")" = 1
          done
          test "$(printf '%s\n' "$listed" | grep -Ec ': test$')" = 5
          cargo test --locked -p sf-conformance --features evidence-receipts \
            --test supported_surface_sqlite -- --test-threads=1
      - name: verify default sf-cli package dependency closure
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin rust-closure-receipt -- --check
      - name: verify parser-worker qualification inputs
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin rust-closure-receipt -- --check --profile parser-worker-qualification-inputs-v1
      - name: clippy controlled performance receipt tooling
        run: cargo clippy --locked -p sf-bench --features performance-receipts --all-targets -- -D warnings
      - name: test controlled performance receipt tooling
        run: cargo test --locked -p sf-bench --features performance-receipts
      - name: verify fixed performance scenario authority
        run: cargo run --locked -p sf-bench --features performance-receipts --bin sf-performance-receipt -- check-scenarios
      - name: verify generated capability, backend, standards, and README claims
        run: cargo run --locked -p sf-conformance --bin capability-matrix -- --check
      # W3C RDB2RDF conformance gate (ADR-0005). The canonical inventory contains
      # 87 cases and per-ID outcome policy; the preceding read-only checks reject
      # input, outcome, generated-artifact, or public-claim drift. This command also
      # emits EARL with non-deterministic blank-node labels; that diff is not committed.
      - name: conformance (W3C RDB2RDF)
        run: cargo run --locked -p sf-cli -- conformance

  required:
    name: required
    needs: [changes, coding-harness, supervisor-service, postgresql-public-acl-replay, postgresql-observation-qualification, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      SELECT_RUST: ${{ needs.changes.outputs.rust }}
      SELECT_CODING_HARNESS: ${{ needs.changes.outputs.coding_harness }}
      SELECT_SUPERVISOR: ${{ needs.changes.outputs.supervisor }}
      SELECT_ACL_REPLAY: ${{ needs.changes.outputs.acl_replay }}
      SELECT_PG_OBSERVATION: ${{ needs.changes.outputs.pg_observation }}
      RUST_RESULT: ${{ needs.build.result }}
      CODING_HARNESS_RESULT: ${{ needs['coding-harness'].result }}
      SUPERVISOR_RESULT: ${{ needs['supervisor-service'].result }}
      ACL_REPLAY_RESULT: ${{ needs['postgresql-public-acl-replay'].result }}
      PG_OBSERVATION_RESULT: ${{ needs['postgresql-observation-qualification'].result }}
    steps:
      - name: require every selected gate and reject malformed selection
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          check() {
            selected="$1"
            result="$2"
            case "$selected" in
              true) test "$result" = success ;;
              false) test "$result" = skipped || test "$result" = success ;;
              *) return 1 ;;
            esac
          }
          test "$SELECT_ACL_REPLAY" != true || test "$SELECT_SUPERVISOR" = true
          test "$SELECT_SUPERVISOR" != true || test "$SELECT_CODING_HARNESS" = true
          test "$SELECT_PG_OBSERVATION" != true || test "$SELECT_RUST" = true
          test "$SELECT_PG_OBSERVATION" != true || test "$SELECT_CODING_HARNESS" = true
          check "$SELECT_RUST" "$RUST_RESULT"
          check "$SELECT_CODING_HARNESS" "$CODING_HARNESS_RESULT"
          check "$SELECT_SUPERVISOR" "$SUPERVISOR_RESULT"
          check "$SELECT_ACL_REPLAY" "$ACL_REPLAY_RESULT"
          check "$SELECT_PG_OBSERVATION" "$PG_OBSERVATION_RESULT"

  readiness:
    name: meta-harness readiness telemetry (ADR-0026)
    runs-on: ubuntu-24.04
    # Read-layer telemetry only (ADR-0026 Part A) — non-blocking, drift tracking.
    # 2026-07-05 baseline: harnessFit 71 · compileConfidence 100 · scaffoldReady true.
    # The readiness CLI and its Darwin dependency are integrity-locked by the
    # coding-harness package lock and installed without lifecycle scripts.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: install integrity-locked readiness CLI
        run: npm --prefix coding-harness ci --ignore-scripts --include=dev --omit=optional
      - name: harness score + genome + mcp-scan + threat-model (informational snapshot)
        run: |
          { echo '### Meta-harness readiness (ADR-0026)'; echo '```json'; } >> "$GITHUB_STEP_SUMMARY"
          ./coding-harness/node_modules/.bin/metaharness score . --json | tee score.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
