name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  coding-harness:
    name: coding harness · node ${{ matrix.node }} · build · test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
            native_required: '0'
          - node: '24.14.1'
            native_required: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The acceptance-task contract verifies the immutable #8 source-fix
          # commit, so its history is a test input rather than an optimisation.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: coding-harness/package-lock.json
      - name: install pinned harness dependencies
        run: npm --prefix coding-harness ci --ignore-scripts
      - name: build canonical coding harness
        run: npm --prefix coding-harness run build
      - name: verify committed controller attestation is current
        run: git diff --exit-code -- coding-harness/.harness/controller-build.json
      - name: test canonical coding harness
        env:
          HARNESS_REQUIRE_NATIVE_INTEGRATION: ${{ matrix.native_required }}
        run: npm --prefix coding-harness test

  supervisor-service:
    name: supervisor service · node ${{ matrix.node }} · sealed build · test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
          - node: '24.14.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: coding-harness/supervisor-service/package-lock.json
      - name: install pinned supervisor-service dependencies
        run: npm --prefix coding-harness/supervisor-service ci --ignore-scripts
      - name: verify sealed supervisor-service artifact
        run: npm --prefix coding-harness/supervisor-service run verify
      - name: verify committed supervisor-service attestation is current
        run: git diff --exit-code -- coding-harness/supervisor-service/.service/artifact.json

  postgresql-public-acl-replay:
    name: PostgreSQL ACL V1 + V2 + projection mutations · node ${{ matrix.node }} · eight isolated runs
    runs-on: ubuntu-24.04
    # Covers the conservative 140-minute sum of all eight isolated replay/cleanup ceilings.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.0.0'
          - node: '24.14.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: pull exact PostgreSQL 16.15 platform manifest
        run: docker pull postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
      - name: replay V1, V2, and projection mutations from owned isolated containers
        run: |
          node coding-harness/supervisor-service/scripts/replay-postgresql-public-acl-baseline-v1.mjs
          node coding-harness/supervisor-service/scripts/replay-postgresql-public-acl-baseline-v2.mjs
          node coding-harness/supervisor-service/scripts/verify-postgresql-public-acl-projection-branch-mutations-v1.mjs
          node coding-harness/supervisor-service/scripts/verify-postgresql-public-acl-projection-final-where-mutations-v1.mjs

  build:
    name: fmt · clippy · build · test
    runs-on: ubuntu-24.04
    # Live PostgreSQL/MySQL/SQL Server service containers. The sealed PostgreSQL
    # RDB2RDF receipt check below explicitly requires this live service; the other
    # provider-specific suites still expose their live-optional grade in the generated
    # capability matrix rather than silently becoming production-admission evidence.
    # `sqlserver-backend` is
    # already enabled here via workspace feature unification (sf-conformance
    # depends on sf-sql with it on) — no extra feature flag is needed below.
    services:
      postgres:
        image: postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8 # postgres:16
        env:
          POSTGRES_USER: sftest
          POSTGRES_PASSWORD: sftest
          POSTGRES_DB: sftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0 # mysql:8
        env:
          MYSQL_ROOT_PASSWORD: sftest
          MYSQL_DATABASE: sftest
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89 # 2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SfTest123!
        ports:
          - 11433:1433
    env:
      SF_PG_URL: "host=localhost port=5432 user=sftest password=sftest dbname=sftest"
      SF_MYSQL_URL: "mysql://root:sftest@127.0.0.1:13306/sftest"
      SF_MSSQL_URL: "server=tcp:localhost,11433;user id=SA;password=SfTest123!"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # SQL Server has no lightweight in-container healthcheck tool available to
      # `options:`, unlike postgres/mysql above — poll the TCP port directly instead.
      - name: wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/11433) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::warning::SQL Server did not become reachable in time — differential_mssql will skip gracefully"
      # Dependency vulnerability gate (F2 item 3, ADR-0010 closeout receipt):
      # `cargo audit` reads .cargo/audit.toml's documented ignore-list (advisories
      # confirmed unfixable without an upstream crate's own version bump) and fails
      # the build on anything not on it — a real gate, not `|| true`.
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        run: cargo --locked audit
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --locked --workspace --all-targets
      - name: test
        run: cargo test --locked --workspace
      # DuckDB backend (embedded, `bundled` feature — no external service needed).
      # `cargo test --locked --workspace` above doesn't enable `duckdb-backend` and no other
      # crate in the dependency graph turns it on, so these tests never ran in CI
      # until this dedicated step was added.
      - name: test (sf-sql duckdb-backend)
        run: cargo test --locked -p sf-sql --features duckdb-backend
      # SAP HANA marshalling/quoting unit tests only (backend::hana::tests::with_driver) —
      # pure value-marshalling logic with no connection, safe to run here. The rest of
      # the hana-backend surface needs a live SAP HANA server, so it's excluded.
      - name: test (sf-sql hana-backend marshalling)
        run: cargo test --locked -p sf-sql --features hana-backend backend::hana::tests::with_driver
      # ODBC quote-escaping unit tests only (backend::odbc::real::tests) — pure string
      # logic, no live driver/DSN needed. `odbc-api` links against the SYSTEM unixODBC
      # library at COMPILE time even for this (confirmed: the feature fails to link
      # without libodbc present, despite the test itself doing no ODBC I/O), so the
      # driver manager package is installed first; the rest of the odbc-backend surface
      # (DB2/H2/Spark/Dremio/Denodo/Teiid) needs a live DSN, so it's excluded.
      - name: install unixODBC (odbc-backend link dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev=2.3.12-1ubuntu0.24.04.1
      - name: test (sf-sql odbc-backend quote-escaping)
        run: cargo test --locked -p sf-sql --features odbc-backend backend::odbc::real::tests
      - name: verify canonical RDB2RDF inventory
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-inventory -- --check
      - name: replay sealed SQLite RDB2RDF outcome baseline
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-execution-receipt -- --check
      - name: replay sealed required-live PostgreSQL RDB2RDF outcome baseline
        run: cargo run --locked -p sf-conformance --bin rdb2rdf-execution-receipt -- --backend postgresql --check
      - name: clippy deterministic evidence receipt tooling
        run: cargo clippy --locked -p sf-conformance --features evidence-receipts --all-targets -- -D warnings
      # This mutable hosted runner validates only the bounded parser and receipt
      # contract. It is not a controlled provenance builder, so CI neither captures
      # nor publishes a current-binary observation here.
      - name: test deterministic evidence receipt tooling
        run: cargo test --locked -p sf-conformance --features evidence-receipts --lib --test binary_artifact_receipt --test regression_baseline_cli --test rust_closure_receipt -- --test-threads=1
      - name: replay expected SQLite SPARQL query regression baseline
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin sparql-query-regression-baseline -- --check
      - name: replay expected SQLite SPARQL protocol regression baseline
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin sparql-protocol-regression-baseline -- --check
      - name: verify default sf-cli package dependency closure
        run: cargo run --locked -p sf-conformance --features evidence-receipts --bin rust-closure-receipt -- --check
      - name: clippy controlled performance receipt tooling
        run: cargo clippy --locked -p sf-bench --features performance-receipts --all-targets -- -D warnings
      - name: test controlled performance receipt tooling
        run: cargo test --locked -p sf-bench --features performance-receipts
      - name: verify fixed performance scenario authority
        run: cargo run --locked -p sf-bench --features performance-receipts --bin sf-performance-receipt -- check-scenarios
      - name: verify generated capability, backend, standards, and README claims
        run: cargo run --locked -p sf-conformance --bin capability-matrix -- --check
      # W3C RDB2RDF conformance gate (ADR-0005). The canonical inventory contains
      # 87 cases and per-ID outcome policy; the preceding read-only checks reject
      # input, outcome, generated-artifact, or public-claim drift. This command also
      # emits EARL with non-deterministic blank-node labels; that diff is not committed.
      - name: conformance (W3C RDB2RDF)
        run: cargo run --locked -p sf-cli -- conformance

  readiness:
    name: meta-harness readiness telemetry (ADR-0026)
    runs-on: ubuntu-24.04
    # Read-layer telemetry only (ADR-0026 Part A) — non-blocking, drift tracking.
    # 2026-07-05 baseline: harnessFit 71 · compileConfidence 100 · scaffoldReady true.
    # The readiness CLI and its Darwin dependency are integrity-locked by the
    # coding-harness package lock and installed without lifecycle scripts.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: install integrity-locked readiness CLI
        run: npm --prefix coding-harness ci --ignore-scripts --include=dev --omit=optional
      - name: harness score + genome + mcp-scan + threat-model (informational snapshot)
        run: |
          { echo '### Meta-harness readiness (ADR-0026)'; echo '```json'; } >> "$GITHUB_STEP_SUMMARY"
          ./coding-harness/node_modules/.bin/metaharness score . --json | tee score.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ./coding-harness/node_modules/.bin/metaharness genome . --json || true
          ./coding-harness/node_modules/.bin/harness mcp-scan . --json || true
          ./coding-harness/node_modules/.bin/harness threat-model . --json || true
          fit=$(jq -r '.harnessFit' score.json)
          echo "harnessFit=$fit (ADR-0026 baseline: 71)"
          if [ "$fit" -lt 60 ]; then
            echo "::warning::harnessFit $fit is below the 60 floor — readiness regression vs ADR-0026 baseline"
          fi
          # oia-audit / drift-from-history persist to a stateful memory store and are
          # not meaningful in an ephemeral CI runner — run those interactively/locally
          # per ADR-0026 Part A, not here.
