name: harness-native

on:
  workflow_dispatch:

jobs:
  native-isolation:
    name: native isolation · node 24.14.1 · required capability gate
    # Hosted GitHub runners cannot create the network namespace required by the
    # production bwrap contract. This job is intentionally dispatched only to a
    # provisioned runner whose labels attest that it can enforce both boundaries.
    runs-on: [self-hosted, linux, x64, bwrap, systemd-user]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: coding-harness/package-lock.json
      - name: Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - name: preflight native isolation capabilities
        run: |
          test "$(uname -m)" = x86_64
          test -x /usr/bin/bwrap
          test "$(stat -c %s /usr/bin/bwrap)" = 72160
          echo '52231e1caf55bcbc667b269f49c63599a6f7db4767ae6a039580d0ff853db712  /usr/bin/bwrap' |
            sha256sum --check --strict
          test -x /usr/bin/systemd-run
          test -n "${XDG_RUNTIME_DIR:-}"
          test -n "${DBUS_SESSION_BUS_ADDRESS:-}"
          bwrap_args=(--unshare-net)
          for source in /usr /usr/lib /usr/lib64; do
            [ -e "$source" ] || continue
            destination="$source"
            [ "$source" != /usr/lib ] || destination=/lib
            [ "$source" != /usr/lib64 ] || destination=/lib64
            bwrap_args+=(--ro-bind "$source" "$destination")
          done
          /usr/bin/bwrap "${bwrap_args[@]}" -- /usr/bin/true
          /usr/bin/systemd-run --user --quiet --wait --collect --pipe --service-type=exec -- /usr/bin/true
      - name: install pinned harness dependencies
        run: npm --prefix coding-harness ci --ignore-scripts
      - name: build canonical coding harness
        run: npm --prefix coding-harness run build
      - name: test native isolation contract
        env:
          HARNESS_REQUIRE_NATIVE_INTEGRATION: '1'
        run: npm --prefix coding-harness test
      - name: build release-profile sf-cli binary for sealed runtime observation
        run: cargo build --locked --release -p sf-cli
      # These private one-shot tests establish that the exact late seccomp
      # policy kills a forbidden socket syscall and still permits sealed-source
      # copies to reproduce the prior loader view. They emit no durable receipt
      # and grant no syscall trace, execution provenance, admission, performance,
      # or release authority.
      - name: test sealed-source-copy runtime observation and seccomp canary
        timeout-minutes: 20
        run: |
          test_name='binary_artifact_receipt::runtime_linkage::object_authority::tests::prepared_probe::prepared_probe_observes_the_current_release_profile_binary_from_sealed_source_copies'
          listed="$(cargo test --locked -p sf-conformance --features evidence-receipts --lib "$test_name" -- --ignored --exact --list)"
          test "$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test")" = 1
          cargo test --locked -p sf-conformance --features evidence-receipts --lib "$test_name" -- --ignored --exact --test-threads=1
          canary_name='binary_artifact_receipt::runtime_linkage::object_authority::tests::prepared_seccomp::prepared_seccomp_native_canary_kills_a_forbidden_socket_syscall'
          canary_listed="$(cargo test --locked -p sf-conformance --features evidence-receipts --lib "$canary_name" -- --ignored --exact --list)"
          test "$(printf '%s\n' "$canary_listed" | grep -Fxc "$canary_name: test")" = 1
          cargo test --locked -p sf-conformance --features evidence-receipts --lib "$canary_name" -- --ignored --exact --test-threads=1
