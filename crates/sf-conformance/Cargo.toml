[package]
name = "sf-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "semantic-fabric W3C RDB2RDF conformance harness + EARL + M⋈T SHACL gate (ADR-0005)"

[features]
default = ["sqlserver-backend"]
sqlserver-backend = ["sf-sql/sqlserver-backend"]
evidence-receipts = [
    "dep:cargo-platform",
    "dep:libc",
    "sf-sql/postgres-observation-evidence",
]

[dependencies]
sf-core.workspace = true
sf-sql = { workspace = true, features = ["rest-backends"] }
sf-mapping.workspace = true
sf-sparql.workspace = true
sf-validation.workspace = true
# Graph-isomorphism comparison + N-Quads/Turtle parsing of expected output (ADR-0005).
oxrdf.workspace = true
oxttl.workspace = true
# In-memory SQLite fixture per W3C case (matches the sf-sparql execution wave).
rusqlite = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
sha2.workspace = true
libc = { workspace = true, optional = true }
cargo-platform = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# Live PostgreSQL conformance run (ADR-0005/0010/0015): a throwaway database per
# sealed suite run, executed via the PgRowStream cursor. Local provider absence
# is typed untested; required CI mode fails when the provider is unavailable.
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
# Live MySQL differential (ADR-0024 M4): a throwaway database per run over a real
# server, executed via the packet-streamed exec_iter cursor. Skips gracefully when
# no server is reachable (probe / SF_MYSQL_URL), so CI stays green.
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls"] }
# In-memory differential oracle (ADR-0005 / ADR-0004): spareval evaluates the same
# SPARQL over the expected RDF graph as the independent second evaluator. ADR-0004
# sanctions spareval for the in-memory oracle ONLY (never the OBDA hot path); pins
# match the workspace exactly (oxrdf =0.3.3, spargebra =0.4.6, sparesults =0.3.3).
spareval = { version = "0.2.6", features = ["sparql-12"] }
spargebra.workspace = true

[dev-dependencies]
sf-serve.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
deadpool-postgres = "0.14"

[[test]]
name = "differential_mssql"
required-features = ["sqlserver-backend"]

[[bin]]
name = "sparql-query-regression-baseline"
path = "src/bin/sparql-query-regression-baseline.rs"
required-features = ["evidence-receipts"]

[[bin]]
name = "sparql-protocol-regression-baseline"
path = "src/bin/sparql-protocol-regression-baseline.rs"
required-features = ["evidence-receipts"]

[[bin]]
name = "rust-closure-receipt"
path = "src/bin/rust-closure-receipt.rs"
required-features = ["evidence-receipts"]

[[bin]]
name = "current-sf-cli-artifact-observation"
path = "src/bin/current-sf-cli-artifact-observation.rs"
required-features = ["evidence-receipts"]

[[bin]]
name = "postgres-observation-qualification"
path = "src/bin/postgres-observation-qualification.rs"
required-features = ["evidence-receipts"]

[[test]]
name = "regression_baseline_cli"
required-features = ["evidence-receipts"]

[[test]]
name = "rust_closure_receipt"
required-features = ["evidence-receipts"]

[[test]]
name = "binary_artifact_receipt"
required-features = ["evidence-receipts"]
