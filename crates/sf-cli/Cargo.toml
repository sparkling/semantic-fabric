[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "semantic-fabric command-line interface — the single binary (ADR-0006)"

[[bin]]
name = "semantic-fabric"
path = "src/main.rs"

[features]
default = []
parser-worker-evidence = ["sf-sparql/parser-worker-evidence"]
query-v1-transport-evidence = ["sf-sparql/query-v1-transport-evidence"]
query-v1-transport-mutant-evidence = ["sf-sparql/query-v1-transport-mutant-evidence"]

[[test]]
name = "private_worker_handshake"
path = "tests/private_worker_handshake.rs"
required-features = ["parser-worker-evidence"]

[[test]]
name = "private_query_v1_transport"
path = "tests/private_query_v1_transport.rs"
required-features = ["query-v1-transport-evidence"]

[[test]]
name = "private_query_v1_transport_mutant"
path = "tests/private_query_v1_transport_mutant.rs"
required-features = ["query-v1-transport-mutant-evidence"]

[dependencies]
sf-core.workspace = true
sf-sparql.workspace = true
sf-conformance.workspace = true
sf-bench.workspace = true
sf-serve.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
toml.workspace = true
libc.workspace = true

[dev-dependencies]
axum.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
uuid = { version = "1", features = ["v4"] }
