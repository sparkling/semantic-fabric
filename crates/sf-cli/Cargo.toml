[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "semantic-fabric command-line interface — the single binary (ADR-0006)"

[[bin]]
name = "semantic-fabric"
path = "src/main.rs"

[features]
default = []
parser-worker-evidence = ["sf-sparql/parser-worker-evidence"]
query-v1-transport-evidence = ["sf-sparql/query-v1-transport-evidence"]
query-v1-transport-mutant-evidence = ["sf-sparql/query-v1-transport-mutant-evidence"]

[[test]]
name = "private_worker_handshake"
path = "tests/private_worker_handshake.rs"
required-features = ["parser-worker-evidence"]

[[test]]
name = "private_query_v1_transport"
path = "tests/private_query_v1_transport.rs"
required-features = ["query-v1-transport-evidence"]

[dependencies]
sf-core.workspace = true
sf-sparql.workspace = true
sf-conformance.workspace = true
sf-bench.workspace = true
sf-serve.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
libc.workspace = true
