[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "semantic-fabric command-line interface — the single binary (ADR-0006)"

[features]
# DuckDB remains opt-in because it adds a bundled native engine and a distinct
# serving admission lane.
duckdb-backend = ["sf-serve/duckdb-backend"]

[[bin]]
name = "semantic-fabric"
path = "src/main.rs"

[dependencies]
sf-core.workspace = true
sf-sparql.workspace = true
sf-conformance.workspace = true
sf-bench.workspace = true
sf-serve.workspace = true
clap.workspace = true
anyhow.workspace = true
