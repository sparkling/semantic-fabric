[package]
name = "sf-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "semantic-fabric SPARQL 1.2 Protocol HTTP endpoint over the OBDA virtualiser (ADR-0019 G8, ADR-0010/0011)"

[dependencies]
sf-core.workspace = true
sf-sql.workspace = true
sf-sparql.workspace = true
sf-mapping.workspace = true
sf-validation.workspace = true
# RDF/result serialisers reused from the Oxigraph substrate (ADR-0004/0019).
oxrdf.workspace = true
oxttl.workspace = true
oxjsonld.workspace = true
sparesults.workspace = true
# HTTP stack (ADR-0019 G8 — own the 1.2 endpoint) + bounded streaming (ADR-0010 §C).
axum.workspace = true
tower.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
form_urlencoded.workspace = true
http-body-util = "0.1"
http-body = "1"
# Source drivers (held in the server backend; ADR-0006).
rusqlite = { workspace = true, features = ["bundled"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
deadpool-postgres = "0.14" # PG connection pool for the serve lane (ADR-0010 §C stream-lane pool, ADR-0027; M4 wave-2 finding 2) — was a single shared Client, serialising all PG HTTP requests
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls"] } # MySQL serve backend (ADR-0024 M4, §4.2 dedicated-conn lane)
thiserror.workspace = true
sha2.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
metrics.workspace = true
libc.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
form_urlencoded.workspace = true
tokio = { workspace = true, features = ["test-util"] }
rusqlite = { workspace = true, features = ["bundled", "functions"] }
spargebra.workspace = true
spareval = { version = "0.2.6", features = ["sparql-12", "sep-0002", "sep-0006"] }
tracing-subscriber.workspace = true
metrics-exporter-prometheus.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
