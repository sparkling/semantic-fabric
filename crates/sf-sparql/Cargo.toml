[package]
name = "sf-sparql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "semantic-fabric virtualizer: SPARQL→SQL OBDA rewriting (ADR-0007)"

[dependencies]
sf-core.workspace = true
sf-sql.workspace = true
sf-mapping.workspace = true
spargebra.workspace = true
oxsdatatypes.workspace = true  # exact Decimal accumulation for AVG (M3 fix 1) — the SAME fixed-point i128 type the spareval oracle uses for decimal AVG, never f64
# sparopt (ADR-0007 pipeline step 2, opt-in/bypassable) is intentionally NOT
# wired into the engine optimizer. The ADR-0007 order-disciplined cascade is the
# sole optimizer, so adding an opt-in pre-rewrite stage would duplicate authority.
# The pinned sparopt 0.3.6 does compile with this workspace's 1.2 feature set and
# remains available transitively through the conformance oracle (ADR-0019).
oxjsonld.workspace = true      # JSON-LD 1.2 output for CONSTRUCT/DESCRIBE (ADR-0006/0019); wired now so the 1.2 surface resolves
thiserror.workspace = true
rayon = "1.12"                  # chunked term-gen batch parallelism, exec_core (ADR-0006 rayon/tokio pool separation, M4 wave-2 batch restructure)
quick_cache = "0.7"             # PlanCache production drop-in (ADR-0007 cache.rs doc comment): approximately-LRU, never a wholesale clear
rusqlite = { workspace = true, features = ["bundled"] } # SQLite execution of emitted SQL (this-wave target)
tokio-postgres = "0.7"         # PostgreSQL execution of emitted SQL via PgRowStream/query_raw (ADR-0010 §C)
bytes = "1"                    # BytesMut, for the ToSql wrapper that binds lexical params to the placeholder's inferred PG type
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls"] } # MySQL execution (WS-D)

[dev-dependencies]
oxrdf.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] } # async MySQL integration test
